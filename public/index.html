                            </div>
                        </div>
                    </div>
                )}
            </PageWrapper>
        )
    }

    // --- [新增] Scenario Simulation & Conversion Page ---
    function ScenarioSimulationPage({ selectedModel, apiKey }) {
        const [originalContent, setOriginalContent] = React.useState('');
        const [convertedContent, setConvertedContent] = React.useState('');
        const [targetSimulator, setTargetSimulator] = React.useState('Carla');
        const [isConverting, setIsConverting] = React.useState(false);
        const [error, setError] = React.useState('');
        const [fileName, setFileName] = React.useState('converted_scenario.xosc');
        const [isCarlaSimulating, setIsCarlaSimulating] = React.useState(false);
        // --- [新增] 调用 Carla 仿真的处理函数 ---
        const handleRunCarla = async () => {
            if (!convertedContent) { 
                setError("Please convert the scenario first."); 
                return; 
            }
            setIsCarlaSimulating(true);
            setError('');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/run_carla_simulation`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ xosc_content: convertedContent })
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Failed to start Carla simulation");
                
                // 成功启动后提示用户
                alert(`✅ Simulation Started!\n${result.message}`);
            } catch (err) {
                setError(`Simulation Error: ${err.message}`);
            } finally {
                setIsCarlaSimulating(false);
            }
        };
        // 处理本地文件上传读取
        const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            // 预设下载文件名
            setFileName(file.name.replace('.xosc', '_carla.xosc').replace('.xml', '_carla.xosc'));
            
            const reader = new FileReader();
            reader.onload = (evt) => {
                setOriginalContent(evt.target.result);
                setConvertedContent(''); // 清空旧的转化结果
                setError('');
            };
            reader.readAsText(file);
        };

        // 调用后端转化 API
        const handleConvert = async () => {
            if (!originalContent) { setError("Please select and load an OpenSCENARIO file first."); return; }
            if (selectedModel !== 'local' && !apiKey) { alert("Please enter your API Key in the top right header."); return; }
            
            setIsConverting(true); 
            setError('');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/convert_scenario`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        original_xosc: originalContent,
                        target_simulator: targetSimulator,
                        model_selection: selectedModel,
                        api_key: apiKey
                    })
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Conversion failed");
                
                setConvertedContent(result.converted_xosc);
            } catch (err) {
                setError(`Conversion Error: ${err.message}`);
            } finally {
                setIsConverting(false);
            }
        };

        const handleSave = async () => {
            if (!convertedContent) return;
            
            // 复用 isConverting 状态来防止多次点击导致弹出多个窗口
            setIsConverting(true);
            try {
                const response = await fetch(`${API_BASE_URL}/api/save_converted_xosc`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        converted_xosc: convertedContent,
                        default_filename: fileName
                    })
                });

                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || "Server save error.");
                }

                if (result.status === 'success') {
                    alert(`Saved successfully to:\n${result.saved_path}`);
                } else if (result.status === 'cancelled') {
                    // 用户取消，不需要弹窗报错
                    console.log("Save operation cancelled by user.");
                }
            } catch (err) {
                alert("Failed to save file: " + err.message);
            } finally {
                setIsConverting(false);
            }
        };

        return (
            <PageWrapper 
                title="Scenario Format Conversion" 
                subtitle="Upload a local OpenSCENARIO file and convert it to match the standard of specific simulator platforms (e.g., CARLA)."
            >
                <div className="flex flex-col md:flex-row gap-6 h-[70vh]">
                    
                    {/* 左侧：本地文件读取与原代码展示 */}
                    <div className="flex-1 bg-white p-5 border border-gray-200 rounded-lg shadow-sm flex flex-col h-full">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 className="font-bold text-gray-800 text-lg">1. Original File</h3>
                            <span className="text-xs font-bold px-2 py-1 rounded bg-gray-100 text-gray-600">Source: Esmini</span>
                        </div>
                        
                        <div className="mb-4 flex items-center gap-3">
                            <label className="inline-flex items-center px-4 py-2 rounded-md bg-blue-50 text-blue-700 text-sm font-semibold border border-blue-100 hover:bg-blue-100 cursor-pointer transition-colors">
                                选择文件
                                <input 
                                    type="file" 
                                    accept=".xosc,.xml" 
                                    onChange={handleFileUpload} 
                                    className="hidden" 
                                />
                            </label>
                            <span className="text-sm text-gray-500 truncate flex-1">{originalContent ? fileName : '请先选择一个 .xosc 文件'}</span>
                        </div>
                        
                        <div className="flex-1 mb-4 relative">
                            <div className="absolute inset-0 xosc-code-area overflow-auto text-xs border border-gray-300 bg-gray-50 text-black font-mono">
                                {originalContent || <span className="text-gray-400 italic">No file selected. Please choose a .xosc file to display its content...</span>}
                            </div>
                        </div>

                        <div className="flex items-center gap-3">
                            <select 
                                value={targetSimulator} 
                                onChange={e => setTargetSimulator(e.target.value)} 
                                className="border border-gray-300 rounded-md p-2 flex-1 text-sm focus:ring-blue-500 focus:border-blue-500"
                            >
                                <option value="Carla">Convert to Carla Simulator</option>
                            </select>
                            
                            <button 
                                onClick={handleConvert} 
                                disabled={isConverting || !originalContent} 
                                className="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 disabled:opacity-50 flex items-center font-semibold shadow-sm transition-colors"
                            >
                                {isConverting && <LoadingIconSvg className="w-4 h-4 text-white mr-2"/>}
                                {isConverting ? "Converting..." : "Convert"}
                            </button>
                        </div>
                        {error && <p className="text-red-500 text-sm mt-3 bg-red-50 p-2 rounded border border-red-100">{error}</p>}
                    </div>

                    {/* 右侧：转化后代码展示与保存 */}
                    <div className="flex-1 bg-white p-5 border border-gray-200 rounded-lg shadow-sm flex flex-col h-full">
                        <div className="flex justify-between items-center mb-4 border-b pb-2">
                            <h3 className="font-bold text-gray-800 text-lg">2. Converted Output</h3>
                            <span className="text-xs font-bold px-2 py-1 rounded bg-green-100 text-green-800">Target: {targetSimulator}</span>
                        </div>
                        
                        <div className="flex-1 mb-4 relative">
                            <div className="absolute inset-0 xosc-code-area overflow-auto text-xs border border-gray-300 bg-gray-50 text-black font-mono">
                                {convertedContent || <span className="text-gray-400 italic">Converted OpenSCENARIO code will appear here...</span>}
                            </div>
                        </div>

                        <div className="flex flex-col gap-3 mt-auto">
                            <button 
                                onClick={handleRunCarla} 
                                disabled={!convertedContent || isCarlaSimulating || isConverting} 
                                className="bg-orange-500 text-white px-6 py-2 rounded-md hover:bg-orange-600 disabled:opacity-50 w-full font-semibold shadow-sm flex justify-center items-center transition-colors"
                            >
                                {isCarlaSimulating ? <LoadingIconSvg className="w-4 h-4 mr-2 text-white"/> : (
                                    <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                )}
                                {isCarlaSimulating ? "Starting Carla..." : "Run Simulation (Carla)"}
                            </button>

                            <button 
                                onClick={handleSave} 
                                disabled={!convertedContent || isConverting} 
                                className="bg-green-600 text-white px-6 py-2 rounded-md hover:bg-green-700 disabled:opacity-50 w-full font-semibold shadow-sm flex justify-center items-center transition-colors"
                            >
                                <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Save Converted File
                            </button>
                        </div>
                    </div>
                    
                </div>
            </PageWrapper>
        );
    }

    // Single Scenario Card Component
    const DisplaySingleScenario = ({ scenario, source, isActive, onCardClick, cardState, understandingData, onStep1Click, onStep2Click, onSpeedChange, onPhysicsChange, onSaveFilesClick, onRunSimulationClick, onTabChange, onDeleteFileClick, isSelected, onToggleBatch }) => {
        if (!scenario) return null;
        
        // --- [新增状态] 导出过程中的加载状态 ---
        const [isExporting, setIsExporting] = React.useState(false);

        const activeClasses = isActive ? "ring-2 ring-blue-500 shadow-xl scale-102" : "hover:shadow-lg hover:ring-1 hover:ring-blue-300/50";
        const isStep1Done = cardState.understandingDone;
        const isStep2Done = cardState.simulationCodeGenerated;
        
        const getCodeAreaClass = (code) => {
            if (!code) return "border-gray-500/50";
            if (code.trim().startsWith("# ERROR:")) return "error-border";
            return "success-border";
        };

        // --- [新增函数] 处理一键导出 ZIP 包 ---
        const handleExportPackage = async (e) => {
            e.stopPropagation();

            // Validation check
            if (!cardState.openscenarioCode) {
                alert("No OpenSCENARIO code generated yet. Please complete Step 2 first.");
                return;
            }

            setIsExporting(true);
            try {
                const xodrFile = cardState.matchedMapInfo ? cardState.matchedMapInfo.xodr_file : "unknown.xodr";

                // 1. Send request to backend
                // This request will "hang" until the user closes the dialog on the backend
                const response = await fetch(`${API_BASE_URL}/api/export_scenario_package`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        openscenario_code: cardState.openscenarioCode,
                        opendrive_filename: xodrFile,
                        scenario_name: scenario.name || "scenario"
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || "Server export error.");
                }

                // 2. Handle result
                if (result.status === 'cancelled') {
                    console.log("User cancelled the save operation.");
                    // Optional: You can show a toast message here if needed
                } else if (result.status === 'success') {
                    // ENGLISH ALERT
                    alert(`Export successful!\nFile saved to:\n${result.saved_path}`);
                }

            } catch (err) {
                console.error(err);
                // ENGLISH ALERT
                alert("Export process error: " + err.message);
            } finally {
                setIsExporting(false);
            }
        };

        return (
            <div className={`relative bg-white border border-gray-200 rounded-lg p-6 mt-4 transition-all ${isActive ? 'cursor-default' : 'cursor-pointer'} ${activeClasses}`} onClick={onCardClick}>
                {/* === [新增] 右上角多选框 === */}
                {source !== 'library' && isActive && !cardState.understandingDone && (
                    <div className="absolute top-4 right-4 z-10" onClick={e => e.stopPropagation()}>
                        <label className="flex items-center cursor-pointer space-x-2 bg-blue-50/80 px-3 py-1.5 rounded-md border border-blue-200 hover:bg-blue-100 transition-colors shadow-sm">
                            <input 
                                type="checkbox" 
                                className="w-4 h-4 text-blue-600 rounded border-blue-300 focus:ring-blue-500 cursor-pointer"
                                checked={isSelected}
                                onChange={onToggleBatch}
                            />
                            <span className="text-sm font-bold text-blue-800 select-none">Add to Queue</span>
                        </label>
                    </div>
                )}
                <div className="flex items-center mb-2">
                    {source !== 'library' ? (
                        <span className="text-xs font-bold mr-3 px-3 py-1 rounded-full bg-cyan-100 text-cyan-800">AI Gen</span>
                    ) : (
                        (() => {
                        const libId = scenario?.library_id || scenario?.from_library || 'cda';
                        if (libId === 'cidas') return <span className="text-xs font-bold mr-3 px-3 py-1 rounded-full bg-red-100 text-red-800">CIDAS</span>;
                        else if (libId === 'cda') return <span className="text-xs font-bold mr-3 px-3 py-1 rounded-full bg-green-100 text-green-800">GB</span>;
                        else if (libId === 'project') return <span className="text-xs font-bold mr-3 px-3 py-1 rounded-full bg-orange-100 text-orange-800">PRO</span>;
                        else return <span className="text-xs font-bold mr-3 px-3 py-1 rounded-full bg-purple-100 text-purple-800">Rec. Lib</span>;
                        })()
                    )}
                    <h3 className="text-xl font-semibold">{scenario.name || "Unnamed Scenario"}</h3>
                </div>
                
                {isActive && (
                    <>
                        <div className="flex space-x-2 border-b mb-4 mt-4">
                             <button className={`pb-2 px-2 text-sm font-medium ${cardState.activeTab === 'scenario' ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500'}`} onClick={(e) => {e.stopPropagation(); onTabChange('scenario');}}>Logical Scenario</button>
                             {isStep1Done && <button className={`pb-2 px-2 text-sm font-medium ${cardState.activeTab === 'understanding' ? 'border-b-2 border-indigo-500 text-indigo-600' : 'text-gray-500'}`} onClick={(e) => {e.stopPropagation(); onTabChange('understanding');}}>Understanding & Tuning</button>}

                        {cardState.activeTab === 'openscenario' && (

                                                {cardState.physicsParams.targets && Object.entries(cardState.physicsParams.targets).map(([tName, tParams]) => (

                                                                    value={tParams.init_speed}
                                                                    onChange={(e) => onPhysicsChange('targets', tName, 'init_speed', e.target.value)}
                                                                />
                                                            </div>
                                                            {/* 2. Init Pos S */}
                                                            <div className="flex justify-between items-center mb-1">
                                                                <label className="text-xs text-gray-600 font-semibold">Init Pos S:</label>
                                                                <input type="number" step="1.0" className="w-14 text-xs border rounded px-1 py-0.5 text-right focus:ring-1 focus:ring-red-500 bg-gray-50"
                                                                    value={tParams.init_s}
                                                                    onChange={(e) => onPhysicsChange('targets', tName, 'init_s', e.target.value)}
                                                                />
                                                            </div>
                                                            {/* 3. [新增] Road ID */}
                                                            <div className="flex justify-between items-center mb-1">
                                                                <label className="text-xs text-gray-600 font-semibold">Road ID:</label>
                                                                <input type="text" className="w-14 text-xs border rounded px-1 py-0.5 text-right focus:ring-1 focus:ring-red-500 bg-gray-50"
                                                                    value={tParams.init_road_id || ''}
                                                                    onChange={(e) => onPhysicsChange('targets', tName, 'init_road_id', e.target.value)}
                                                                />
                                                            </div>
                                                            {/* 4. [新增] Lane ID */}
                                                            <div className="flex justify-between items-center">
                                                                <label className="text-xs text-gray-600 font-semibold">Lane ID:</label>
                                                                <input type="text" className="w-14 text-xs border rounded px-1 py-0.5 text-right focus:ring-1 focus:ring-red-500 bg-gray-50"
                                                                    value={tParams.init_lane_id || ''}
                                                                    onChange={(e) => onPhysicsChange('targets', tName, 'init_lane_id', e.target.value)}
                                                                />
                                                            </div>
                                                        </div>

                                                        {/* Dynamic Actions List */}
                                                        {tParams.speed_actions && tParams.speed_actions.length > 0 && (
                                                            <div className="mt-2 border-t border-red-100 pt-2">
                                                                <span className="block text-[10px] text-gray-400 uppercase font-bold mb-1">Events (Target Speed)</span>
                                                                {tParams.speed_actions.map((action, idx) => (
                                                                    <div key={idx} className="flex justify-between items-center mb-1 bg-red-50/50 p-1 rounded">
                                                                        <label className="text-[10px] text-red-800 flex-1 mr-2 break-all" title={action.event_name}>
                                                                            {action.event_name}:
                                                                        </label>
                                                                        <input type="number" step="0.5" className="w-14 text-xs border border-red-200 rounded px-1 py-0.5 text-right focus:ring-1 focus:ring-red-500 shrink-0"
                                                                            value={action.target_speed}
                                                                            onChange={(e) => onPhysicsChange('targets', tName, null, e.target.value, idx)}
                                                                        />
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                                {(!cardState.physicsParams.targets || Object.keys(cardState.physicsParams.targets).length === 0) && (
                                                    <div className="text-xs text-gray-400 italic text-center p-2">No dynamic targets found</div>

                                        </div>
                                    </div>

                                {/* --------------------------- */}
                                
                                <div className="flex space-x-2">
                                    <button onClick={onSaveFilesClick} disabled={cardState.isSavingFiles} className="flex-1 bg-blue-600 text-white py-2 rounded text-sm font-medium hover:bg-blue-700 disabled:opacity-50 flex justify-center items-center">
                                        {cardState.isSavingFiles && <LoadingIconSvg className="w-4 h-4 text-white"/>} {cardState.isSavingFiles ? "Saving..." : "Save Files"}
                                    </button>

                                    <button onClick={handleExportPackage} disabled={isExporting} className="flex-1 bg-teal-600 text-white py-2 rounded text-sm font-medium hover:bg-teal-700 disabled:opacity-50 flex justify-center items-center">
                                        {isExporting ? <LoadingIconSvg className="w-4 h-4 text-white"/> : (
                                            <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                            </svg>
                                        )}

                                        {cardState.isSimulating && <LoadingIconSvg className="w-4 h-4 text-white"/>} {cardState.isSimulating ? "Starting..." : "Run Sim"}
                                    </button>

                                        disabled={!cardState.savedPaths?.xosc_1_0_path_on_server || cardState.isDeleting} 
                                        // 修改点 1: 将 w-12 改为 flex-1，让它和其他按钮平分宽度，布局更协调
                                        className="flex-1 bg-red-100 text-red-600 border border-red-200 py-2 rounded text-sm font-medium hover:bg-red-200 hover:text-red-800 disabled:opacity-30 disabled:cursor-not-allowed flex justify-center items-center"

    };
     
    // Scenario Library Page
    function ScenarioManagementPage({ scenariosData, libraryId, libraryName, password, setCurrentPage, onSimulateLibraryScenario, onRefreshLibrary, adminPassword }) {
        const [expandedScenarioId, setExpandedScenarioId] = React.useState(null);
        const [searchQuery, setSearchQuery] = React.useState('');
        const [searchResults, setSearchResults] = React.useState(null);
        const [isSearching, setIsSearching] = React.useState(false);
        const [searchError, setSearchError] = React.useState('');
        const [isDeleting, setIsDeleting] = React.useState(false); // 新增删除状态

        const handleSearch = async (e) => {
            e.preventDefault();
            if (!searchQuery.trim()) { setSearchResults(null); return; }
            setIsSearching(true); setSearchError(''); setSearchResults([]); setExpandedScenarioId(null);
            try {
                const response = await fetch(`${API_BASE_URL}/api/search_scenarios`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: searchQuery, k: 20, library_id: libraryId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Search failed');
                setSearchResults(data.results);
            } catch (err) {
                setSearchError(err.message);
            } finally {
                setIsSearching(false);
            }
        };

        // --- 新增：删除场景逻辑 ---
        const handleDeleteScenario = async (e, scenarioId) => {
            e.stopPropagation();
            
            // 弹出确认框
            if (!confirm(`Are you sure you want to delete scenario ID: ${scenarioId}? This action cannot be undone.`)) return;

            setIsDeleting(true);

            const passwordToSend = adminPassword ? adminPassword : password;

            try {
                const response = await fetch(`${API_BASE_URL}/api/delete_library_scenario`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        library_id: libraryId,
                        scenario_id: scenarioId,
                        password: passwordToSend // <--- 发送选定的密码
                    })
                });
                const result = await response.json();
                
                if (!response.ok) throw new Error(result.error || "Delete failed");
                
                alert("Scenario deleted successfully.");
                setExpandedScenarioId(null);
                
                // 刷新列表
                if (onRefreshLibrary) {
                    onRefreshLibrary();
                }

            } catch (err) {
                alert(`Error deleting scenario: ${err.message}`);
            } finally {
                setIsDeleting(false);
            }
        };

        const ScenarioCard = ({ scenario, isExpanded, onExpand, relevanceScore, datasetLabel }) => (
            <div className={`bg-white border border-gray-200 rounded-lg p-6 transition-all duration-300 ease-in-out cursor-pointer ${isExpanded ? 'shadow-xl ring-2 ring-blue-500' : 'hover:shadow-md'}`} onClick={onExpand}>
                <div className="flex justify-between items-start">
                    <div className="flex-1 pr-4">
                        <div className="flex items-center gap-2 mb-1">
                            {datasetLabel && (
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${
                                    datasetLabel === 'CIDAS' ? 'bg-red-100 text-red-800' : 
                                    (datasetLabel === 'GB' || datasetLabel === 'CDA') ? 'bg-green-100 text-green-800' : 
                                    (datasetLabel === 'CQU' || datasetLabel === 'Private') ? 'bg-orange-100 text-orange-800' :
                                    'bg-gray-100 text-gray-800'
                                }`}>
                                    {datasetLabel}
                                </span>
                            )}
                            <h3 className="text-lg font-semibold text-blue-800">{scenario.id}: {scenario.name}</h3>
                        </div>
                    </div>
                    {relevanceScore && <span className="text-xs font-mono text-white bg-blue-500 px-2 py-1 rounded-full whitespace-nowrap">Relevance: {relevanceScore.toFixed(3)}</span>}
                </div>
                {isExpanded && (
                    <div className="mt-4 pt-4 border-t border-blue-200 space-y-4 text-sm">
                        <p className="text-gray-600 whitespace-pre-line">{scenario.description}</p>
                        {scenario.layers && <div><h4 className="font-semibold mb-2">Layers:</h4><ul className="list-disc pl-6 space-y-1">{Object.entries(scenario.layers).map(([k, v]) => (<li key={k}><strong>{k}:</strong> {(typeof v === 'object' && v !== null && v.hasOwnProperty('description')) ? v.description : JSON.stringify(v)}</li>))}</ul></div>}
                        {scenario.annotations && <div><h4 className="font-semibold mb-2">Annotations:</h4><ul className="list-disc pl-6 space-y-1">{Object.entries(scenario.annotations).map(([k, v]) => (<li key={k}><strong>{k.replace(/_/g, ' ')}:</strong> {String(v)}</li>))}</ul></div>}
                       
                        <div className="pt-4 mt-2 border-t border-gray-100 flex justify-between items-center">
                             {/* --- 新增：删除按钮 --- */}
                             <button
                                onClick={(e) => handleDeleteScenario(e, scenario.id)}
                                disabled={isDeleting}
                                className="text-red-500 hover:text-red-700 text-sm flex items-center px-3 py-2 rounded hover:bg-red-50 transition-colors"
                             >
                                <ICONS.trash className="w-4 h-4 mr-1"/>
                                {isDeleting ? "Deleting..." : "Delete Scenario"}
                             </button>

                             <button 
                                onClick={(e) => { e.stopPropagation(); onSimulateLibraryScenario(scenario); }}
                                className="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 shadow-md flex items-center transition-colors text-sm font-bold"
                             >
                                <ICONS.simulation className="w-4 h-4 mr-2"/>
                                Load Scenario for Sim & Code Gen
                             </button>
                        </div>

                    </div>
                )}
            </div>
        );
        const displayedScenarios = searchResults !== null ? searchResults : scenariosData.map(s => ({ scenario_data: s }));
        return (
            <PageWrapper title={libraryName} subtitle="Browse, search, and manage all test scenarios in the library.">
                <div className="flex gap-4 mb-8">
                    <form onSubmit={handleSearch} className="flex-grow flex gap-3">
                        <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Enter scenario description for semantic search (e.g., Highway pop-out)..." className="flex-grow p-3 border rounded-lg" disabled={isSearching} />
                        <button type="submit" className="bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg flex items-center disabled:opacity-50" disabled={isSearching || !searchQuery.trim()}> {isSearching ? <LoadingIconSvg /> : 'Search'} </button>
                    </form>
                    <button className="border-2 border-dashed border-gray-300 text-blue-600 py-3 px-6 rounded-lg flex items-center" onClick={() => setCurrentPage("ai_assisted_scenario")}> <ICONS.ai className="w-5 h-5 mr-2" /> AI Assist Add </button>
                </div>

        const handleSearch = async (e) => {
            e.preventDefault();
            if (!searchQuery.trim()) { setSearchResults(null); return; }
            setIsSearching(true); setSearchError(''); setSearchResults([]); setExpandedTriggerId(null);

                const response = await fetch(`${API_BASE_URL}/api/search_triggers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: searchQuery, k: 30, library_id: libraryId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Search failed');

                setSearchError(err.message);

    // --- Manual Import Page Component ---
    function ManualScenarioImportPage({ scenarioLibs, refreshLibrary, setCurrentPage, adminPassword }) {
        const [formData, setFormData] = React.useState({
            name: '',
            description: '',
            targetLibrary: 'cda', // 默认选中 cda，实际会根据列表渲染
            password: '' // <--- [新增] 密码字段
        });
        const [files, setFiles] = React.useState({
            xosc: null,
            xodr: null
        });
        const [isUploading, setIsUploading] = React.useState(false);
        const [status, setStatus] = React.useState({ type: '', msg: '' });

        // 处理文本输入 (包括新增的密码输入)
        const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({ ...prev, [name]: value }));
        };

        // 处理文件选择
        const handleFileChange = (e, type) => {
            const file = e.target.files && e.target.files[0];
            setFiles(prev => ({ ...prev, [type]: file || null }));
        };

        // 提交表单
        const handleSubmit = async (e) => {
            e.preventDefault();
            
            // 1. 基础校验
            if (!formData.name || !files.xosc) {
                setStatus({ type: 'error', msg: 'Name and .xosc file are required.' });
                return;
            }

            // 获取当前选中的库对象
            const selectedLib = scenarioLibs[formData.targetLibrary];
            const isProtected = selectedLib && selectedLib.password;

            // 2. 权限校验
            if (isProtected && !formData.password && !adminPassword) {
                setStatus({ type: 'error', msg: 'Password is required for this library.' });
                return;
            }

            setIsUploading(true);
            setStatus({ type: 'info', msg: 'Uploading...' });

            const uploadData = new FormData();
            uploadData.append('name', formData.name);
            uploadData.append('description', formData.description);
            uploadData.append('target_library_id', formData.targetLibrary);
            
            // 3. 密码处理
            if (adminPassword) {
                 uploadData.append('password', adminPassword);
            } else if (isProtected) {
                 uploadData.append('password', formData.password);
            }

            uploadData.append('xosc_file', files.xosc);
            if (files.xodr) uploadData.append('xodr_file', files.xodr);

            try {
                const response = await fetch(`${API_BASE_URL}/api/manual_import_scenario`, {
                    method: 'POST',
                    body: uploadData
                });

                // [关键修改] 先检查响应文本，防止解析非 JSON 响应时崩溃
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (jsonError) {
                    throw new Error(`Server returned non-JSON response: ${responseText.substring(0, 100)}...`);
                }
                
                if (!response.ok) throw new Error(result.error || "Upload failed");

                setStatus({ type: 'success', msg: `Success! Scenario ID: ${result.scenario_data.id}` });
                
                // 刷新库并跳转
                if (refreshLibrary) refreshLibrary(formData.targetLibrary);
                setTimeout(() => {
                    setCurrentPage(`scenario_library_${formData.targetLibrary}`);
                }, 1500);

            } catch (err) {
                console.error("Upload Error:", err);
                setStatus({ type: 'error', msg: err.message });
            } finally {
                // [关键] 无论成功失败，都必须停止 Loading
                setIsUploading(false);
            }
        };

        // 获取当前选中的库对象，判断是否受保护
        const selectedLib = scenarioLibs[formData.targetLibrary];
        const isProtected = selectedLib && selectedLib.password;

        return (
            <PageWrapper title="Manual Scenario Import" subtitle="Upload existing OpenSCENARIO (.xosc) and OpenDRIVE (.xodr) files directly to the library.">
                <div className="max-w-2xl mx-auto bg-white p-8 rounded-lg border border-gray-200 shadow-sm mt-4">
                    <form onSubmit={handleSubmit} className="space-y-6">
                        
                        {/* 1. Target Library (带密码框的区域) */}
                        <div className="bg-gray-50 p-4 rounded-md border border-gray-200">
                            <label className="block text-sm font-bold text-gray-700 mb-2">Target Library</label>
                            <select 
                                name="targetLibrary" 
                                value={formData.targetLibrary} 
                                onChange={handleInputChange}
                                className="block w-full rounded-md border-gray-300 shadow-sm p-2.5 bg-white mb-2"
                            >
                                {Object.values(scenarioLibs).map(lib => (
                                    <option key={lib.id} value={lib.id}>{lib.name}</option>
                                ))}
                            </select>

                            {/* === [新增] 动态显示密码输入框 === */}
                            {isProtected && (
                                <div className="mt-3 animate-fadeIn">
                                    <label className="block text-sm font-bold text-red-600 mb-1">
                                        Library Password Required
                                    </label>
                                    <input 
                                        type="password"
                                        name="password"
                                        value={formData.password}
                                        onChange={handleInputChange}
                                        className="block w-full rounded-md border-red-300 focus:border-red-500 focus:ring-red-500 shadow-sm p-2 text-sm"
                                        placeholder="Enter password to authorize upload..."
                                        required
                                    />
                                </div>
                            )}
                            {/* ================================== */}
                        </div>

                        {/* 2. Metadata */}
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">Scenario Name *</label>
                            <input 
                                type="text" 
                                name="name"
                                value={formData.name}
                                onChange={handleInputChange}
                                className="block w-full rounded-md border-gray-300 shadow-sm p-2"
                                placeholder="e.g. Manual Test Case 01"
                                required
                            />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-gray-700 mb-2">Description</label>
                            <textarea 
                                name="description"
                                value={formData.description}
                                onChange={handleInputChange}
                                rows="3"
                                className="block w-full rounded-md border-gray-300 shadow-sm p-2"
                                placeholder="Describe the scenario..."
                            />
                        </div>

                        {/* 3. Files */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-100">
                            {/* OpenSCENARIO */}
                            <div>
                                <label className="block text-sm font-bold text-blue-700 mb-2">OpenSCENARIO (.xosc) *</label>
                                <div className="flex items-center">
                                    <input 
                                        id="xosc-upload"
                                        type="file" 
                                        accept=".xosc,.xml"
                                        onChange={(e) => handleFileChange(e, 'xosc')}
                                        className="hidden" 
                                        required
                                    />
                                    <label 
                                        htmlFor="xosc-upload"
                                        className="cursor-pointer bg-blue-50 text-blue-700 font-semibold py-2 px-4 rounded-full text-sm hover:bg-blue-100 transition-colors mr-3 border-0"
                                    >
                                        Choose File
                                    </label>
                                    <span className="text-sm text-gray-500 truncate max-w-[200px]">
                                        {files.xosc ? files.xosc.name : "No file chosen"}
                                    </span>
                                </div>
                                <p className="text-xs text-gray-400 mt-1">Defines dynamic behavior.</p>
                            </div>

                            {/* OpenDRIVE */}
                            <div>
                                <label className="block text-sm font-bold text-orange-700 mb-2">OpenDRIVE (.xodr)</label>
                                <div className="flex items-center">
                                    <input 
                                        id="xodr-upload"
                                        type="file" 
                                        accept=".xodr,.xml"
                                        onChange={(e) => handleFileChange(e, 'xodr')}
                                        className="hidden" 
                                    />
                                    <label 
                                        htmlFor="xodr-upload"
                                        className="cursor-pointer bg-orange-50 text-orange-700 font-semibold py-2 px-4 rounded-full text-sm hover:bg-orange-100 transition-colors mr-3 border-0"
                                    >
                                        Choose File
                                    </label>
                                    <span className="text-sm text-gray-500 truncate max-w-[200px]">
                                        {files.xodr ? files.xodr.name : "No file chosen"}
                                    </span>
                                </div>
                                <p className="text-xs text-gray-400 mt-1">Optional. Defines static map.</p>
                            </div>
                        </div>

                        {/* Status & Button */}
                        <div className="pt-4">
                            {status.msg && (
                                <div className={`p-4 mb-4 rounded-md ${status.type === 'error' ? 'bg-red-50 text-red-700' : status.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-blue-50 text-blue-700'}`}>
                                    {status.msg}
                                </div>
                            )}
                            <button 
                                type="submit" 
                                disabled={isUploading}
                                className="w-full bg-gray-800 text-white py-3 rounded-lg hover:bg-gray-900 font-semibold shadow-lg transition-transform transform active:scale-95 flex justify-center items-center"
                            >
                                {isUploading ? <LoadingIconSvg className="text-white"/> : <ICONS.knowledge className="w-5 h-5 mr-2"/>}
                                {isUploading ? 'Importing...' : 'Import to Library'}
                            </button>
                        </div>
                    </form>
                </div>
            </PageWrapper>
        );
    }

    // --- APP CONTAINER ---
    function App() {
      // 默认加载 Public 下的 CDA 库
      const [currentPage, setCurrentPage] = React.useState('scenario_library_cda');
      const [allTriggers, setAllTriggers] = React.useState([]);
      const [adminPassword, setAdminPassword] = React.useState(null); // 存储管理员密码
      const isAdmin = !!adminPassword; 
      const handleAdminLogin = (pwd) => {
          if(pwd) setAdminPassword(pwd);
      };
      const handleAdminLogout = () => setAdminPassword(null);
      // --- 核心修改：根据你的要求初始化库列表 ---
      const [scenarioLibs, setScenarioLibs] = React.useState({
        cda: { id: 'cda', name: 'CDA (Public)', file: 'scenarios3.json', password: null, data: [], unlocked: true, isLoading: true, error: null },
        cidas: { id: 'cidas', name: 'CIDAS (Public)', file: 'scenarios.json', password: null, data: [], unlocked: true, isLoading: true, error: null },
        project: { id: 'project', name: 'Project (Private)', file: 'scenarios2.json', password: null, data: null, unlocked: true, isLoading: true, error: null },
      });
      
      const [preSelectedScenario, setPreSelectedScenario] = React.useState(null);
      const [showPasswordModalFor, setShowPasswordModalFor] = React.useState(null);
      const [globalIsLoading, setGlobalIsLoading] = React.useState(true);
      const [globalError, setGlobalError] = React.useState(null);
      const [selectedModel, setSelectedModel] = React.useState('local');
      const [apiKey, setApiKey] = React.useState('');

      const handleSimulateLibraryScenario = (scenarioData) => {
         setPreSelectedScenario(scenarioData);
         setCurrentPage('ai_test_function_scenario');
      };

      const fetchLibraryData = async (libId) => {
        const lib = scenarioLibs[libId];
        if (!lib) return;

        setScenarioLibs(prev => ({ ...prev, [libId]: { ...prev[libId], isLoading: true, error: null } }));
        try {
            const response = await fetch(`./${lib.file}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error(`Failed to load file ${lib.file}. Make sure it exists.`);
            const data = await response.json();
            setScenarioLibs(prev => ({ ...prev, [libId]: { ...prev[libId], data: Array.isArray(data) ? data : [], unlocked: true, isLoading: false } }));
            if (showPasswordModalFor === libId) setShowPasswordModalFor(null);
        } catch (err) {
            setScenarioLibs(prev => ({ ...prev, [libId]: { ...prev[libId], error: err.message, isLoading: false } }));
        }
      };
    
      React.useEffect(() => {
        const initApp = async () => {
            setGlobalIsLoading(true); setGlobalError(null);
            try {
                const listRes = await fetch(`${API_BASE_URL}/api/get_library_list`);
                if (!listRes.ok) throw new Error("Failed to fetch library list");
                const remoteLibs = await listRes.json();
                const newLibsState = {};
                remoteLibs.forEach(lib => {
                    newLibsState[lib.id] = {
                        id: lib.id,
                        name: lib.name,
                        file: lib.file,
                        password: lib.password,
                        data: [], 
                        unlocked: !lib.password, 
                        isLoading: true,
                        error: null
                    };
                });
                setScenarioLibs(prev => ({ ...prev, ...newLibsState }));
                const loadPromises = remoteLibs.map(lib => {
                    if (!lib.password) {
                        return fetch(`./${lib.file}?t=${new Date().getTime()}`)
                            .then(res => {
                                if (!res.ok) return [];
                                return res.json();
                            })
                            .then(data => {
                                setScenarioLibs(prev => ({
                                    ...prev,
                                    [lib.id]: { ...prev[lib.id], data: Array.isArray(data) ? data : [], isLoading: false }
                                }));
                            })
                            .catch(err => {
                                console.warn(`Failed to load ${lib.id}:`, err);
                                setScenarioLibs(prev => ({
                                    ...prev,
                                    [lib.id]: { ...prev[lib.id], isLoading: false, error: "Load failed" }
                                }));
                            });
                    }
                    return Promise.resolve();
                });

                await Promise.all(loadPromises);
                const triggersRes = await fetch(`./triggers.json?t=${new Date().getTime()}`);
                if (triggersRes.ok) {
                    const triggerJsonData = await triggersRes.json();
                    setAllTriggers(Array.isArray(triggerJsonData) ? triggerJsonData : []);
                }

            } catch (err) {
                console.error("Init Error:", err);
                setGlobalError(err.message);
            } finally {
                setGlobalIsLoading(false);
            }
        };

        initApp();
      }, []);
      const handleLibraryAccess = (libId) => {
        const lib = scenarioLibs[libId];
        if (!lib) return;
        if (isAdmin || lib.unlocked) {
            setCurrentPage(`scenario_library_${libId}`);
            if (!lib.data || lib.data.length === 0) fetchLibraryData(libId);
        } else {
            setShowPasswordModalFor(libId);
        }
      };
       const handleDeleteLibrary = async (libId) => {
          const lib = scenarioLibs[libId];
          if (!lib) return;

          // 定义统一的密码变量
          let passwordToSend = null;

          // 1. 权限与密码确认逻辑
          if (isAdmin) {
              // 管理员模式
              if(!confirm(`[ADMIN] Delete library "${lib.name}"?`)) return;
              passwordToSend = adminPassword; 
          } else {
              // 普通模式
              if (lib.password) {
                  // 库有密码，询问用户
                  const input = prompt(`Deleting "${lib.name}" requires authorization.\nPlease enter the password:`);
                  if (input === null) return; // 用户取消
                  
                  // 前端简单校验（也可以交给后端校验）
                  if (input !== lib.password) {
                      alert("Incorrect password. Delete cancelled.");
                      return;
                  }
                  passwordToSend = input;
              } else {
                  // 库无密码，仅二次确认
                  if(!confirm(`Are you sure you want to PERMANENTLY delete library "${lib.name}"? This will delete the file from the server.`)) return;
              }
          } // <--- 之前就是这里少了这个大括号！
          
          try {
              const response = await fetch(`${API_BASE_URL}/api/delete_library`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ 
                      library_id: libId,
                      password: passwordToSend // 使用统一的变量名
                  })
              });

              const result = await response.json();

              if (!response.ok) {
                  throw new Error(result.error || "Delete failed");
              }
              const newLibs = { ...scenarioLibs };
              delete newLibs[libId];
              setScenarioLibs(newLibs);
              if (currentPage === `scenario_library_${libId}`) {
                  setCurrentPage('scenario_library_cda');
              }
              
              alert("Library deleted successfully.");

          } catch (err) {
              alert(`Error deleting library: ${err.message}`);
          }
        };

       const handleAddLibrary = async (type) => {
          // 1. 输入显示名称
          const libName = prompt(`Please enter the name for the new ${type} library:`);
          if (!libName || !libName.trim()) return;
          
          // 2. 输入文件名
          let fileName = prompt(`Please enter the filename for storage (e.g., cqu_lib.json):`, `new_${type}_lib.json`);
          if (!fileName || !fileName.trim()) return;
          if (!fileName.endsWith('.json')) fileName += '.json';

          // 3. 只有 Private 库才询问密码
          let password = null;
          if (type === 'private') {
              password = prompt("Set a password for this private library (Leave empty for no password):");
              if (password && !password.trim()) password = null;
          }

          // === [关键修改] 构造带后缀的名称发送给后端 ===
          // 这样刷新页面后，名字里依然包含 Public/Private，侧边栏就能正确分类了
          const displayNameWithSuffix = `${libName} (${type === 'public' ? 'Public' : 'Private'})`;

          try {
              const response = await fetch(`${API_BASE_URL}/api/create_new_library`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ 
                      filename: fileName,
                      display_name: displayNameWithSuffix, // <--- 这里改成发带后缀的名字
                      password: password
                  })
              });

              if (!response.ok) {
                  const errData = await response.json();
                  throw new Error(errData.error || "Failed to create file on server");
              }
              
              const result = await response.json();
              const finalFileName = result.filename || fileName;
              const newId = finalFileName.replace('.json', ''); 

              // 4. 更新前端状态
              setScenarioLibs(prev => ({
                  ...prev,
                  [newId]: {
                      id: newId, 
                      name: displayNameWithSuffix, // 本地状态保持一致
                      file: finalFileName,
                      password: password,
                      data: [], 
                      unlocked: !password, 
                      isLoading: false, 
                      error: null
                  }
              }));

              alert(`New library "${displayNameWithSuffix}" created successfully!`);
              
              if(password) {
                   setScenarioLibs(prev => ({...prev, [newId]: {...prev[newId], unlocked: true}}));
              }
              setCurrentPage(`scenario_library_${newId}`);

          } catch (err) {
              alert(`Error creating library: ${err.message}`);
          }
        };

      const handlePasswordSubmit = (libId, password) => {
        const lib = scenarioLibs[libId];
        if (password === lib.password) {
            fetchLibraryData(libId);
            setCurrentPage(`scenario_library_${libId}`);
        } else {
            alert('Incorrect Password!');
        }
      };

      const PasswordModal = ({ library, onSubmit, onCancel }) => {
          const [password, setPassword] = React.useState('');
          const handleSubmit = (e) => { e.preventDefault(); onSubmit(library.id, password); };
          return (
              <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
                  <div className="bg-white p-8 rounded-lg shadow-xl w-full max-w-sm">
                      <h2 className="text-xl font-bold mb-4">Authorization Required</h2>
                      <p className="text-gray-600 mb-6">Accessing <span className="font-semibold text-blue-600">{library.name}</span> requires a password.</p>
                      <form onSubmit={handleSubmit}>
                          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-2 border rounded-md mb-4" placeholder="Enter Password" autoFocus />
                          <div className="flex justify-end space-x-4">
                              <button type="button" onClick={onCancel} className="bg-gray-200 py-2 px-4 rounded-lg">Cancel</button>
                              <button type="submit" className="bg-blue-600 text-white py-2 px-4 rounded-lg">Confirm</button>
                          </div>
                      </form>
                  </div>
              </div>
          );
      };

      // 页面渲染路由逻辑
      const renderPage = () => {
        if (globalIsLoading && (currentPage.startsWith('scenario_library_') || currentPage === 'trigger_library')) { return <div className="w-full h-full flex justify-center items-center"><LoadingIconSvg className="h-10 w-10 text-blue-600"/><p>Loading...</p></div>; }
        if (globalError) { return <div className="p-6 bg-red-100 text-red-700"><h2>Data Load Error</h2><p>{globalError}</p></div>; }
   
        // --- 动态路由匹配：处理 scenario_library_XXX ---
        if (currentPage.startsWith('scenario_library_')) {
            const libId = currentPage.replace('scenario_library_', '');
            const lib = scenarioLibs[libId];

            if (!lib) {
                // 如果库ID找不到（比如因为刷新丢失了动态添加的库，或者ID错误），回到默认页
                return <PlaceholderPage title="Library Not Found" />;
            }
            
            if (lib.isLoading) return <div className="w-full h-full flex justify-center items-center"><LoadingIconSvg className="h-8 w-8 text-blue-500" /></div>;
            if (lib.error) return <div className="p-4 bg-red-100 text-red-700">Error loading {lib.name}: {lib.error}</div>;
            
            if (lib.unlocked) {
                return (
                    <ScenarioManagementPage 
                        scenariosData={lib.data || []} // 确保 data 即使为 null 也是数组
                        setCurrentPage={setCurrentPage} 
                        libraryName={lib.name} 
                        libraryId={lib.id}
                        password={lib.password}
                        onRefreshLibrary={() => fetchLibraryData(libId)}
                        onSimulateLibraryScenario={handleSimulateLibraryScenario} 
                        adminPassword={adminPassword}
                    />
                );
            }
            return <PageWrapper title="Access Restricted"><p>Please access this library from the sidebar.</p></PageWrapper>;
        }

        // 其他静态页面路由
        switch (currentPage) {
          case 'trigger_library':
            return <TriggerLibraryPage initialTriggersData={allTriggers} libraryId="triggers1" />;
          // [新增] 将新建的转化页面加入路由渲染
          case 'scenario_simulation':
            return (
                <ScenarioSimulationPage 
                    selectedModel={selectedModel}
                    apiKey={apiKey}
                />
            );
          case 'ai_test_function_scenario': 
            return (
                <AITestFunctionScenarioPage 
                    scenarioLibs={scenarioLibs}
                    preLoadedScenario={preSelectedScenario} 
                    onClearPreLoaded={() => setPreSelectedScenario(null)}
                    selectedModel={selectedModel}
                    apiKey={apiKey}
                />
            );
          
         case 'manual_import_scenario':
            return (
                <ManualScenarioImportPage 
                    scenarioLibs={scenarioLibs}
                    refreshLibrary={fetchLibraryData}
                    setCurrentPage={setCurrentPage}
                    adminPassword={adminPassword}  
                />
            );

          case 'ai_assisted_scenario':
            return (
                <AIAssistedScenarioPage 
                    refreshLibrary={fetchLibraryData} 
                    setCurrentPage={setCurrentPage} 
                    scenarioLibs={scenarioLibs} 
                    selectedModel={selectedModel}
                    apiKey={apiKey}
                    adminPassword={adminPassword}
                />
            );
          case 'openscenario_rules':
            return (
                <PageWrapper title="User Manual">
                {/* 给容器设置高度，例如 h-[85vh] 或具体像素，否则 PDF 可能显示不全 */}
                <div className="flex justify-center mt-4 w-full h-[85vh]">
                    <iframe
                    src="Instructions.png"  // 假设你的文件名为 Instructions.pdf
                    title="User Manual"
                    className="w-full h-full rounded-lg shadow-sm border border-gray-200"
                    />
                </div>
                </PageWrapper>
            );
          default: return <PlaceholderPage title="Welcome" />;
        }
      };
      
      return (
        <div className="h-screen w-screen flex flex-col bg-gray-100">
          {/* Header */}
          <Header selectedModel={selectedModel} setSelectedModel={setSelectedModel} apiKey={apiKey} setApiKey={setApiKey} isAdmin={isAdmin} onAdminLogin={handleAdminLogin} onAdminLogout={handleAdminLogout} />
          <div className="flex flex-grow overflow-hidden">
            {/* Sidebar 传入了 onAddLibrary */}
            <Sidebar 
                currentPage={currentPage} 
                setCurrentPage={setCurrentPage} 
                onLibraryAccess={handleLibraryAccess} 
                onAddLibrary={handleAddLibrary} 
                scenarioLibs={scenarioLibs}      
                onDeleteLibrary={handleDeleteLibrary}
            />
            
            <main className="flex-grow overflow-y-auto main-content">
              {renderPage()}
              {showPasswordModalFor && (
                  <PasswordModal library={scenarioLibs[showPasswordModalFor]} onSubmit={handlePasswordSubmit} onCancel={() => setShowPasswordModalFor(null)} />
              )}
            </main>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<React.StrictMode><App /></React.StrictMode>);
  </script>
</body>
</html>
