<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Scenario Engine - Intelligent Driving Scenario Management Platform</title>
  <!-- React & Tailwind Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: #f3f4f6;
    }
    .main-content {
        height: calc(100vh - 65px);
    }
    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    /* Code Area Styling */
    .xosc-code-area {
      background-color: #eff6ff; color: #0f172a;
      font-family: 'Consolas', 'Monaco', 'Menlo', 'Courier New', monospace;
      font-size: 0.875em; line-height: 1.6; padding: 1rem;
      border-radius: 0.5rem; max-height: 450px; overflow: auto;
      white-space: pre-wrap; word-break: break-all; border: 1px solid #bfdbfe;
    }
    .error-border { border: 2px solid #ef4444 !important; }
    .warning-border { border: 2px solid #f59e0b !important; }
    .success-border { border: 2px solid #22c55e !important; }
     .candidate-card-selected {
        transform: scale(1.02);
        box-shadow: 0 0 0 2px #2563eb, 0 8px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://your-production-url.com';
    const API_BASE_URL = 'http://127.0.0.1:5000';
    // --- ICONS ---
    const LoadingIconSvg = ({className}) => (
      <svg className={`animate-spin -ml-1 mr-3 h-5 w-5 ${className || ''}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    );
    const ICONS = {
        scenario: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path d="M2 3.5A1.5 1.5 0 013.5 2h1.148a1.5 1.5 0 011.06.44l.858.858A1.5 1.5 0 007.624 4h4.752a1.5 1.5 0 011.06.44l.858.858A1.5 1.5 0 0015.352 6H16.5A1.5 1.5 0 0118 7.5v7A1.5 1.5 0 0116.5 16H3.5A1.5 1.5 0 012 14.5v-11z" /><path d="M15 10a1 1 0 00-1-1H6a1 1 0 100 2h8a1 1 0 001-1z" /></svg>,
        trigger: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path d="M3.5 2.75a.75.75 0 00-1.5 0v14.5a.75.75 0 001.5 0v-4.392l1.657-.348a6.443 6.443 0 013.682 0l2.31.482a6.445 6.445 0 003.682 0l1.658-.348a.75.75 0 000-1.474l-1.658-.348a6.443 6.443 0 01-3.682 0l-2.31.482a6.445 6.445 0 00-3.682 0l-1.657-.348V2.75z" /></svg>,
        ai: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path d="M11.235 3.322l1.414-1.414a.75.75 0 011.061 0l2.121 2.121a.75.75 0 010 1.061l-1.414 1.414a.75.75 0 01-1.061 0l-2.121-2.121a.75.75 0 010-1.061zM13.65 8.345a.75.75 0 010 1.061l-2.121 2.12a.75.75 0 01-1.061 0l-1.414-1.415a.75.75 0 010-1.06l2.121-2.121a.75.75 0 011.06 0l1.415 1.414zM8.91 3.593a.75.75 0 00-1.06-1.06L6.435 3.947a.75.75 0 000 1.06L7.85 6.421a.75.75 0 001.06 0l1.415-1.414-1.414-1.414zM3.594 8.91a.75.75 0 00-1.061 1.061l1.414 1.414a.75.75 0 001.06 0l2.121-2.12a.75.75 0 000-1.061L5.009 7.495 3.594 8.91zM2 10a8 8 0 1116 0 8 8 0 01-16 0z" /></svg>,
        tag: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path fillRule="evenodd" d="M5.5 2A1.5 1.5 0 004 3.5v13A1.5 1.5 0 005.5 18h9a1.5 1.5 0 001.5-1.5V7.621a1.5 1.5 0 00-.44-1.06l-4.12-4.122A1.5 1.5 0 0010.378 2H5.5zM10 6.5a1 1 0 00-1 1v5.5a1 1 0 102 0v-5.5a1 1 0 00-1-1z" clipRule="evenodd" /></svg>,
        knowledge: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path fillRule="evenodd" d="M10 2a.75.75 0 01.75.75v.252a.25.25 0 00.499.052l.248-.992a.75.75 0 011.45.364l-.248.992A1.75 1.75 0 0110.75 6H9.25a1.75 1.75 0 01-1.741-2.534l-.248-.992a.75.75 0 011.45-.364l.248.992a.25.25 0 00.499-.052V2.75A.75.75 0 0110 2zM5.003 4.412A.75.75 0 015.75 4h.334a.25.25 0 00.2-.143l.425-.85a.75.75 0 011.342 0l.425.85a.25.25 0 00.2.143h.334a.75.75 0 010 1.5h-.334a.25.25 0 00-.2.143l-.425.85a.75.75 0 01-1.342 0l-.425-.85a.25.25 0 00-.2-.143h-.334a.75.75 0 01-.747-.838zM9.25 10.25a.75.75 0 01.75-.75h2a.75.75 0 010 1.5h-2a.75.75 0 01-.75-.75zM15 4.5a.75.75 0 00-1.5 0v.334a.25.25 0 01-.143.2l-.85.425a.75.75 0 000 1.342l.85.425a.25.25 0 01.143.2v.334a.75.75 0 001.5 0v-.334a.25.25 0 01.143-.2l.85-.425a.75.75 0 000-1.342l-.85-.425a.25.25 0 01-.143-.2V4.5z" clipRule="evenodd" /><path d="M4 9.75a.75.75 0 01.75-.75h10.5a.75.75 0 010 1.5H4.75a.75.75 0 01-.75-.75zM4 13.25a.75.75 0 01.75-.75h10.5a.75.75 0 010 1.5H4.75a.75.75 0 01-.75-.75zM4 16.75a.75.75 0 01.75-.75h10.5a.75.75 0 010 1.5H4.75a.75.75 0 01-.75-.75z" /></svg>,
        simulation: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z" /></svg>,
        trash: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" /></svg>,
    };

    // --- MAIN LAYOUT COMPONENTS ---
    function Header({ selectedModel, setSelectedModel, apiKey, setApiKey, isAdmin, onAdminLogin, onAdminLogout }) {
        const [showAdminInput, setShowAdminInput] = React.useState(false);
        const [tempPass, setTempPass] = React.useState('');

        const handleLogin = (e) => {
            e.preventDefault();
            onAdminLogin(tempPass);
            setShowAdminInput(false);
            setTempPass('');
        };

        return (
            <header className="bg-white border-b border-gray-200 h-[65px] flex items-center justify-between px-6 shadow-sm flex-shrink-0 z-10">
                <div className="flex items-center">
                    <img src="./003.jpg" alt="Logo" className="w-25 h-8 rounded-md mr-3 object-cover" />
                    <span className="text-xl font-semibold text-gray-800">AutoScenarist</span>
                    {isAdmin && <span className="ml-3 bg-red-600 text-white text-xs px-2 py-1 rounded font-bold animate-pulse">ADMIN MODE</span>}
                </div>
                
                <div className="flex items-center space-x-3">
                    {/* 管理员登录区域 */}
                    {!isAdmin ? (
                        <div className="relative">
                            {!showAdminInput ? (
                                <button onClick={() => setShowAdminInput(true)} className="text-sm text-gray-500 hover:text-gray-800 underline">Admin Login</button>
                            ) : (
                                <form onSubmit={handleLogin} className="flex items-center">
                                    <input 
                                        type="password" 
                                        className="border border-gray-300 rounded px-2 py-1 text-xs w-24 mr-1"
                                        placeholder="Admin Pwd"
                                        value={tempPass}
                                        onChange={e => setTempPass(e.target.value)}
                                        autoFocus
                                    />
                                    <button type="submit" className="text-xs bg-gray-800 text-white px-2 py-1 rounded">Go</button>
                                    <button type="button" onClick={() => setShowAdminInput(false)} className="ml-1 text-xs text-gray-400">✕</button>
                                </form>
                            )}
                        </div>
                    ) : (
                        <button onClick={onAdminLogout} className="text-sm text-red-500 hover:text-red-700 underline mr-4">Logout</button>
                    )}

                    <div className="flex flex-col items-end">
                        <select 
                            value={selectedModel} 
                            onChange={(e) => setSelectedModel(e.target.value)}
                            className="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-1.5"
                        >
                            <option value="local">Local (vLLM)</option>
                            <option value="deepseekv3.2">DeepSeek v3.2</option>
                            {/* [新增] Gemini 选项 */}
                            <option value="gemini3_pro">Google Gemini</option>
                        </select>
                    </div>
                    <div className="relative w-64">
                        <input 
                            type="password" 
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                            className="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-1.5" 
                            placeholder={selectedModel === 'local' ? "API Key (Optional)" : "Paste API Key here..."} 
                        />
                    </div>
                </div>
            </header>
        );
    }

    function Sidebar({ currentPage, setCurrentPage, onLibraryAccess, onAddLibrary, scenarioLibs, onDeleteLibrary }) {
        const [openMenuIds, setOpenMenuIds] = React.useState({});
        const publicLibsList = [];
        const privateLibsList = [];
        const systemLibIds = ['cda', 'cidas', 'project', 'triggers1', 'maps_carla'];

        if (scenarioLibs) {
            Object.values(scenarioLibs).forEach(lib => {
                const item = { 
                    id: `scenario_library_${lib.id}`, 
                    label: lib.name, 
                    isLibrary: true, 
                    libId: lib.id,
                    canDelete: !systemLibIds.includes(lib.id) 
                };
                // 简单的分类逻辑：名字里包含 Public 或者是 cda/cidas
                if (lib.name.toLowerCase().includes('public') || lib.id === 'cda' || lib.id === 'cidas') {
                    publicLibsList.push(item);
                } else {
                    privateLibsList.push(item);
                }
            });
        }

        const handleRebuildIndex = async () => {
            // 安全起见，要求输入管理员密码（因为这是耗时操作）
            const pwd = prompt("Rebuilding indices allows new scenarios to be searchable.\nThis requires Admin permission.\nEnter Admin Password:");
            if (!pwd) return;

            // 显示加载状态（这里简单用 alert 阻塞，或者你可以加个 loading state）
            const confirmRebuild = confirm("This process might take a few seconds. Confirm?");
            if (!confirmRebuild) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/rebuild_indices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                const result = await response.json();
                
                if (response.ok) {
                    alert(result.message);
                } else {
                    alert("Error: " + result.error);
                }
            } catch (err) {
                alert("Network error: " + err.message);
            }
        };

        const navItems = [
            {
                id: 'scenario_management',
                label: 'Scenario Management',
                icon: ICONS.scenario,
                subItems: [
                    // === Public Library 组 (动态) ===
                    {
                        id: 'group_public',
                        label: 'Public Library',
                        isGroup: true,
                        icon: (props) => <span className="mr-2 text-base">📂</span>,
                        subItems: [
                            ...publicLibsList, // 展开动态生成的列表
                            { id: 'add_public', label: '+ Add Public Lib', isAction: true, actionType: 'public' },
                        ]
                    },
                    // === Private Library 组 (动态) ===
                    {
                        id: 'group_private',
                        label: 'Private Library',
                        isGroup: true,
                        icon: (props) => <span className="mr-2 text-base">🔒</span>,
                        subItems: [
                            ...privateLibsList, // 展开动态生成的列表
                            { id: 'add_private', label: '+ Add Private Lib', isAction: true, actionType: 'private' },
                        ]
                    }
                ]
            },
            {
                id: 'trigger_management',
                label: 'Triggering Condition',
                icon: ICONS.trigger,
                subItems: [
                    { id: 'trigger_library', label: 'Triggering Library' },
                ]
            },
            {
                id: 'ai_generation',
                label: 'AI Scenario Gen',
                icon: ICONS.ai,
                subItems: [
                    { id: 'ai_assisted_scenario', label: 'Assisted Scenario Gen' },
                    { id: 'manual_import_scenario', label: 'Manual Import / Upload' }, 
                    { id: 'ai_test_function_scenario', label: 'Functional Scenario Gen' },
                    // [新增] 场景转化与仿真菜单项
                    { id: 'scenario_simulation', label: 'Scenario Simulation' } 
                ] 
            },
            {
                id: 'knowledge_base',
                label: 'User Manual',
                icon: ICONS.knowledge,
                subItems: [
                    { id: 'openscenario_rules', label: 'User Manual' },
                ]
            },
            // === [新增] 系统工具 ===
            {
                id: 'system_tools',
                label: 'System Tools',
                icon: (props) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" {...props}><path fillRule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clipRule="evenodd" /></svg>,
                subItems: [
                    { 
                        id: 'rebuild_index_action', 
                        label: '⚡ Update Search Index', 
                        isAction: true, // 标记这是一个动作，不是页面跳转
                        actionFunction: handleRebuildIndex // 绑定上面的函数
                    }
                ]
            }
        ];

        // 2. 自动展开逻辑 (保持不变)
        React.useEffect(() => {
            const newOpenState = { ...openMenuIds };
            let hasChange = false;
            navItems.forEach(item => {
                let containsActive = false;
                if (item.subItems) {
                    if (item.subItems.some(sub => sub.id === currentPage)) containsActive = true;
                    else {
                        item.subItems.forEach(sub => {
                            if (sub.isGroup && sub.subItems) {
                                if (sub.subItems.some(child => child.id === currentPage)) {
                                    containsActive = true;
                                    if (!newOpenState[sub.id]) { newOpenState[sub.id] = true; hasChange = true; }
                                }
                            }
                        });
                    }
                }
                if (containsActive && !newOpenState[item.id]) { newOpenState[item.id] = true; hasChange = true; }
            });
            if (hasChange) setOpenMenuIds(newOpenState);
        }, [currentPage, scenarioLibs]); // 注意依赖项加入了 scenarioLibs

        const toggleMenu = (id) => {
            setOpenMenuIds(prev => ({ ...prev, [id]: !prev[id] }));
        };

        return (
            <aside className="w-60 bg-white border-r border-gray-200 flex-shrink-0 flex flex-col overflow-y-auto">
                <nav className="p-4">
                    <ul>
                        {navItems.map(item => {
                            let isHighLight = item.id === currentPage;
                            if (!isHighLight && item.subItems) {
                                isHighLight = item.subItems.some(sub => {
                                    if (sub.id === currentPage) return true;
                                    if (sub.subItems) return sub.subItems.some(child => child.id === currentPage);
                                    return false;
                                });
                            }
                            const isOpen = openMenuIds[item.id];

                            return (
                                <li key={item.id} className="mb-1">
                                    <a href="#" onClick={(e) => { e.preventDefault(); if (item.subItems) toggleMenu(item.id); else setCurrentPage(item.id); }} 
                                       className={`flex items-center justify-between p-2.5 rounded-md text-sm font-medium transition-colors ${ isHighLight ? 'bg-green-100 text-green-800' : 'text-gray-700 hover:bg-gray-100' }`} >
                                        <div className="flex items-center"><item.icon className="w-5 h-5 mr-3" /><span>{item.label}</span></div>
                                        {item.subItems && (<svg className={`w-4 h-4 transition-transform ${isOpen ? 'transform rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>)}
                                    </a>

                                    {item.subItems && isOpen && (
                                        <ul className="pl-4 mt-1 space-y-1 border-l-2 border-green-100 ml-4">
                                            {item.subItems.map(subItem => {
                                                if (subItem.isGroup) {
                                                    const isGroupExpanded = openMenuIds[subItem.id];
                                                    return (
                                                        <li key={subItem.id}>
                                                            <div onClick={(e) => { e.stopPropagation(); toggleMenu(subItem.id); }} className="flex items-center justify-between p-2 rounded-md text-sm font-semibold text-gray-700 hover:bg-gray-100 cursor-pointer select-none">
                                                                <div className="flex items-center">{subItem.icon && <subItem.icon />}<span>{subItem.label}</span></div>
                                                                <svg className={`w-3 h-3 transition-transform ${isGroupExpanded ? 'transform rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" /></svg>
                                                            </div>
                                                            {isGroupExpanded && subItem.subItems && (
                                                                <ul className="pl-6 mt-1 space-y-1">
                                                                    {subItem.subItems.map(child => (
                                                                        <li key={child.id} className="relative group"> 
                                                                            <a href="#" onClick={(e) => { 
                                                                                   e.preventDefault(); e.stopPropagation(); 
                                                                                   if (child.isAction) {
                                                                                    if (child.actionFunction) child.actionFunction(); // 执行自定义函数
                                                                                    else onAddLibrary(child.actionType); // 兼容之前的 Add Library
                                                                                    }
                                                                                   else if (child.isLibrary) onLibraryAccess(child.libId); 
                                                                               }} 
                                                                               className={`flex items-center justify-between p-2 rounded-md text-sm transition-colors ${ child.id === currentPage ? 'text-green-700 font-bold bg-green-50' : 'text-gray-500 hover:text-gray-800 hover:bg-gray-50' } ${child.isAction ? 'text-blue-500 hover:text-blue-700 italic' : ''}`}
                                                                            >
                                                                                <span className="truncate pr-6">{child.label}</span>
                                                                                
                                                                                {/* === 删除按钮 === */}
                                                                                {child.canDelete && (
                                                                                    <span 
                                                                                        onClick={(e) => { 
                                                                                            e.stopPropagation(); // 防止触发点击库的跳转
                                                                                            onDeleteLibrary(child.libId); 
                                                                                        }}
                                                                                        className="hidden group-hover:flex absolute right-2 top-2 p-0.5 rounded hover:bg-red-100 text-gray-400 hover:text-red-600 transition-colors"
                                                                                        title="Delete Library"
                                                                                    >
                                                                                        <ICONS.trash className="w-4 h-4" />
                                                                                    </span>
                                                                                )}
                                                                            </a>
                                                                        </li>
                                                                    ))}
                                                                </ul>
                                                            )}
                                                        </li>
                                                    );
                                                }
                                                return (
                                                    <li key={subItem.id}>
                                                    <a href="#" 
                                                        onClick={(e) => { 
                                                            e.preventDefault(); 
                                                            e.stopPropagation(); 
                                                            // [修复] 检查是否是动作按钮，如果是则执行函数，否则才跳转页面
                                                            if (subItem.isAction && subItem.actionFunction) {
                                                                subItem.actionFunction();
                                                            } else {
                                                                setCurrentPage(subItem.id); 
                                                            }
                                                        }} 
                                                        className={`block p-2 rounded-md text-sm cursor-pointer transition-colors ${ 
                                                            // [修复] 为动作按钮添加特殊的样式（蓝色/斜体），普通页面保持原样
                                                            subItem.isAction 
                                                                ? 'text-blue-600 hover:text-blue-800 hover:bg-blue-50 italic font-medium' 
                                                                : (subItem.id === currentPage ? 'bg-green-200/80 text-green-900 font-semibold' : 'text-gray-600 hover:bg-gray-100') 
                                                        }`}
                                                    >
                                                        {/* [可选] 如果是动作，加个小闪电图标前缀 */}
                                                        {subItem.isAction && <span className="mr-1">⚡</span>}
                                                        {subItem.label}
                                                    </a>
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    )}
                                </li>
                            );
                        })}
                    </ul>
                </nav>
            </aside>
        );
    }

    function MarkdownViewerPage({ title, fileUrl }) {
        const [content, setContent] = React.useState(''); const [isLoading, setIsLoading] = React.useState(true); const [error, setError] = React.useState(null);
        React.useEffect(() => { const fetchMarkdown = async () => { setIsLoading(true); setError(null); try { const response = await fetch(`${fileUrl}?t=${new Date().getTime()}`); if (!response.ok) { throw new Error(`Cannot load file: ${response.status} ${response.statusText}`); } const text = await response.text(); setContent(text); } catch (err) { setError(err.message); } finally { setIsLoading(false); } }; fetchMarkdown(); }, [fileUrl]);
        const renderMarkdown = (text) => {
            const lines = text.split('\n'); const elements = []; let i = 0;
            while (i < lines.length) {
                const line = lines[i];
                if (line.startsWith('```')) { const codeLines = []; i++; while (i < lines.length && !lines[i].startsWith('```')) { codeLines.push(lines[i]); i++; } elements.push(<pre key={`code-${i}`} className="xosc-code-area my-4 p-4 rounded-md overflow-x-auto"><code>{codeLines.join('\n')}</code></pre>); i++; continue; }
                if (line.startsWith('# ')) { elements.push(<h1 key={i} className="text-3xl font-bold mt-6 mb-3 pb-2 border-b">{line.substring(2)}</h1>); } else if (line.startsWith('## ')) { elements.push(<h2 key={i} className="text-2xl font-semibold mt-5 mb-2 pb-1 border-b">{line.substring(3)}</h2>); } else if (line.startsWith('### ')) { elements.push(<h3 key={i} className="text-xl font-semibold mt-4 mb-2">{line.substring(4)}</h3>); }
                else if (line.trim().startsWith('- ')) { const listItems = []; while (i < lines.length && lines[i].trim().startsWith('- ')) { const liContent = lines[i].trim().substring(2).split(/(`[^`]+`)/g).map((part, index) => { if (part.startsWith('`') && part.endsWith('`')) { return <code key={index} className="bg-gray-200 text-red-600 font-mono px-1 py-0.5 rounded text-sm">{part.slice(1, -1)}</code>; } return part; }); listItems.push(<li key={i}>{liContent}</li>); i++; } elements.push(<ul key={`ul-${i}`} className="list-disc pl-8 my-3 space-y-1">{listItems}</ul>); continue; }
                else if (line.trim() === '') { /* empty line */ } else { const parts = line.split(/(`[^`]+`)/g).map((part, index) => { if (part.startsWith('`') && part.endsWith('`')) { return <code key={index} className="bg-gray-200 text-red-600 font-mono px-1 py-0.5 rounded text-sm">{part.slice(1, -1)}</code>; } return part; }); elements.push(<p key={i} className="text-base leading-7 my-2">{parts}</p>); }
                i++;
            } return elements;
        };
        return (
            <PageWrapper title={title} subtitle={`Source File: ${fileUrl}`}>
                {isLoading && ( <div className="w-full flex items-center justify-center text-gray-500 mt-20"><LoadingIconSvg className="text-blue-600 h-8 w-8" /><span className="ml-3">Loading document...</span></div> )}
                {error && ( <div className="bg-red-100 border-l-4 border-red-500 p-4 text-red-700 rounded-md"> <h2 className="font-bold">Load Error</h2> <p className="mt-2 text-sm">{error}</p> <p className="mt-2 text-sm">Please ensure file `{fileUrl}` exists in the same directory as `index.html`, and the app is served via HTTP.</p> </div> )}
                {!isLoading && !error && ( <article className="prose prose-lg max-w-none text-gray-800 p-2">{renderMarkdown(content)}</article> )}
            </PageWrapper>
        );
    }

            };
            for (const key in layerInputs) { if (layerInputs[key] && layerInputs[key].trim() !== "") { payload.layer_specific_inputs[key] = layerInputs[key].trim(); } }
         
            try {
                const response = await fetch(`${API_BASE_URL}/api/generate_dangerous_scenario`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';
                let result = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.slice(6));
                        if (data.type === 'progress') {
                            setGenerationProgress({ current: data.completed, total: data.total });
                        } else if (data.type === 'result') {
                            result = data.payload;
                        } else if (data.type === 'error') {
                            throw new Error(data.message);
                        }
                    }
                }

                if (!result) { throw new Error('No result received from server.'); }
                setGeneratedScenarios(result.scenarios || []);
                if (result.scenarios && result.scenarios.length > 0) {
                    const initialCardStates = {}; 
                    result.scenarios.forEach((sw, i) => { initialCardStates[i] = { scenarioData: sw.scenario_data, activeTab: 'scenario' }; }); 
                    setScenarioCardStates(initialCardStates);
                    setCurrentView('results');
                } else { setErrorDSG("API call successful, but no valid scenarios generated."); }
            } catch (err) { setErrorDSG("Error generating natural language scenario: " + err.message); } finally { setIsLoadingDSG(false); }
        };

        const onSingleTaskStart = (index, scenarioJsonData) => {
            const tasks = [{ index, name: scenarioJsonData.name || "Unnamed Scenario", status: 'pending' }];
            const abortController = new AbortController();
            understandAbortRef.current = abortController;
            setAgentProgressModal({
                isOpen: true,
                batchTasks: tasks,
                currentActiveIndex: index,
                streamBlocks: [],
                status: 'processing',
                errorMsg: ''
            });
            handleUnderstandScene(index, scenarioJsonData, false, abortController.signal);
        };

        // === [修改] 批量队列执行函数 ===
        const startBatchProcess = async () => {
            const tasks = selectedForBatch.map(idx => ({ 
                index: idx, 
                name: generatedScenarios[idx].scenario_data.name || "Unnamed Scenario", 
                status: 'pending' 
            }));
            const abortController = new AbortController();
            understandAbortRef.current = abortController;
            
            setAgentProgressModal({
                isOpen: true,
                batchTasks: tasks,
                currentActiveIndex: null,
                streamBlocks: [],
                status: 'processing',
                errorMsg: ''
            });
            
            setBatchState({ isProcessing: true, current: 0, total: selectedForBatch.length });
            
            for (let i = 0; i < selectedForBatch.length; i++) {
                const targetIndex = selectedForBatch[i];
                setBatchState(prev => ({ ...prev, current: i + 1 }));

                let attempt = 0;
                let succeeded = false;

                while (attempt < 3 && !succeeded) {
                    attempt += 1;
                    try {
                        await handleUnderstandScene(targetIndex, generatedScenarios[targetIndex].scenario_data, true, abortController.signal);
                        succeeded = true;
                        // 成功后，等待一小段时间再进入下一个
                        await new Promise(resolve => setTimeout(resolve, 1000));
                    } catch (e) {
                        if (abortController.signal.aborted) {
                            setBatchState({ isProcessing: false, current: 0, total: 0 });
                            return;
                        }
                        if (attempt >= 3) {
                            setAgentProgressModal(prev => {
                                const newTasks = prev.batchTasks.map(t => t.index === targetIndex ? { ...t, status: 'error' } : t);
                                return {
                                    ...prev,
                                    batchTasks: newTasks,
                                    errorMsg: `Scenario ${targetIndex + 1} failed after 3 attempts and was skipped.`
                                };
                            });
                        } else {
                            await new Promise(resolve => setTimeout(resolve, 800));
                        }
                    }
                }
            }
            
            setBatchState({ isProcessing: false, current: 0, total: 0 });
            setSelectedForBatch([]);
            // 全部结束后将总体状态设为成功
            setAgentProgressModal(prev => ({ ...prev, status: 'success' }));
        };

        // === [核心修改] 处理场景分析并混合数据流 ===
        const handleUnderstandScene = async (index, scenarioJsonData, isBatch = false, abortSignal = null) => {
            if (scenarioCardStates[index]?.understandingDone) return;
            if (selectedModel !== 'local' && !apiKey) { alert("Please enter your API Key."); return; }
            if (abortSignal?.aborted) throw new DOMException('Aborted', 'AbortError');

            // 开始当前任务的流
            setAgentProgressModal(prev => {
                const newTasks = prev.batchTasks.map(t => t.index === index ? { ...t, status: 'processing' } : t);
                return { 
                    ...prev, 
                    currentActiveIndex: index,
                    batchTasks: newTasks,
                    streamBlocks: [{ type: 'log', text: '🤖 Agent Task Initialized. Analyzing layout...' }],
                    status: 'processing',
                    errorMsg: ''
                };
            });

            setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isUnderstanding: true, understandingError: null } }));

            try {
                const response = await fetch(`${API_BASE_URL}/api/generate_structured_text`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: abortSignal || undefined,
                    body: JSON.stringify({ logical_scenario_json: scenarioJsonData, model_selection: selectedModel, api_key: apiKey })
                });

                if (!response.ok) throw new Error("HTTP Error " + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                let finalResult = null;

                const appendStreamBlock = (block) => {
                    setAgentProgressModal(prev => ({
                        ...prev,
                        streamBlocks: [...prev.streamBlocks, block]
                    }));
                };

                const processStreamEvent = (data) => {
                    switch (data.type) {
                        case 'step_start':
                            // 保留步骤状态但不额外渲染合成日志，避免重复显示
                            return;
                        case 'log':
                            appendStreamBlock({ type: 'log', text: data.message || '' });
                            return;
                        case 'node_summary':
                            appendStreamBlock({ type: 'node_summary', text: `📌 ${data.content}` });
                            return;
                        case 'result':
                            finalResult = data.payload;
                            return;
                        case 'error':
                            throw new Error(data.message);
                        default:
                            return;
                    }
                };

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.trim() || !line.startsWith('data: ')) continue;
                        processStreamEvent(JSON.parse(line.slice(6)));
                    }
                }

                if (!finalResult) throw new Error("Stream closed before receiving result.");

                const reasoningMap = finalResult.reasoning && [
                    ['🧠 Environment reasoning', finalResult.reasoning.environment_reasoning],
                    ['⏱️ Duration reasoning', finalResult.reasoning.duration_reasoning],
                    ['🚗 Base entities reasoning', finalResult.reasoning.base_entities_reasoning],
                    ['🎯 Final entities reasoning', finalResult.reasoning.final_entities_reasoning],
                ].filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== '');

                if (reasoningMap?.length) {
                    appendStreamBlock({
                        type: 'thought_bundle',
                        blocks: reasoningMap.map(([label, value]) => ({ type: 'thought', text: `${label}\n${String(value)}` }))
                    });
                }

                const speedOptions = (finalResult.speed_candidates || []).map((item, i) => ({ ...item, key: `speed_${i}`, selectedValue: item.value }));
                setUnderstandingState(prev => ({ ...prev, [index]: { structuredText: finalResult.structured_text, matchedMapInfo: finalResult.matched_map_info, speedOptions } }));
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isUnderstanding: false, understandingDone: true, activeTab: 'understanding' } }));

                // 标记任务成功
                setAgentProgressModal(prev => {
                    const newTasks = prev.batchTasks.map(t => t.index === index ? { ...t, status: 'success' } : t);
                    return { ...prev, batchTasks: newTasks, status: isBatch ? 'processing' : 'success' };
                });

                if (!isBatch) {
                    setTimeout(() => { setAgentProgressModal(prev => ({ ...prev, isOpen: false })); }, 1800);
                }

            } catch (err) {
                setAgentProgressModal(prev => {
                    const newTasks = prev.batchTasks.map(t => t.index === index ? { ...t, status: 'error' } : t);
                    return { ...prev, status: 'error', batchTasks: newTasks, errorMsg: err.message };
                });
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isUnderstanding: false, understandingError: err.message } }));
                throw err; 
            }
        };

        const handleConfirmAndGenerateCode = async (index) => { /* 保持原代码 */
            const uData = understandingState[index];
            if (!uData) return;
            if (selectedModel !== 'local' && !apiKey) { alert("Please enter your API Key in the top right header."); return; }
            setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isGeneratingCode: true, codeGenError: null } }));
            let finalText = uData.structuredText;
            try {
                const response = await fetch(`${API_BASE_URL}/api/generate_code_from_text`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ structured_text: finalText, matched_map_info: uData.matchedMapInfo, model_selection: selectedModel, api_key: apiKey })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Code generation failed");
                setScenarioCardStates(prev => ({
                    ...prev, [index]: { ...prev[index], structuredText: finalText, openscenarioCode: result.openscenario_code, opendriveCode: result.opendrive_code, matchedMapInfo: uData.matchedMapInfo, physicsParams: result.physics_parameters || {}, simulationCodeGenerated: true, isGeneratingCode: false, activeTab: 'openscenario', savedPaths: {} }
                }));
            } catch (err) {
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isGeneratingCode: false, codeGenError: err.message } }));
            }
        };

        const handlePhysicsParamChange = (index, category, entityKey, field, value, actionIndex = null) => { /* 保持原代码 */
            setScenarioCardStates(prev => {
                const card = prev[index];
                const oldParams = card.physicsParams || {};
                const newParams = JSON.parse(JSON.stringify(oldParams));
                let targetObj = null;
                if (category === 'ego') { if (!newParams.ego) newParams.ego = { init_speed: 0, init_s: 0, speed_actions: [] }; targetObj = newParams.ego; } 
                else if (category === 'targets') { if (!newParams.targets) newParams.targets = {}; if (!newParams.targets[entityKey]) newParams.targets[entityKey] = { init_speed: 0, init_s: 0, speed_actions: [] }; targetObj = newParams.targets[entityKey]; }
                if (targetObj) { if (actionIndex !== null) { if (targetObj.speed_actions && targetObj.speed_actions[actionIndex]) { targetObj.speed_actions[actionIndex].target_speed = value; } } else { targetObj[field] = value; } }
                return { ...prev, [index]: { ...card, physicsParams: newParams } };
            });
        };

        const handleSaveFilesToServer = async (index) => { /* 保持原代码 */
            const cardState = scenarioCardStates[index];
            const originalScenarioName = generatedScenarios[index].scenario_data.name;
            if (!cardState?.openscenarioCode) return;
            setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSavingFiles: true, saveFileStatus: null, saveFileError: null } }));
            try {
                const response = await fetch(`${API_BASE_URL}/api/save_simulation_files`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ openscenario_code: cardState.openscenarioCode, opendrive_code: cardState.opendriveCode, scenario_name: originalScenarioName, modified_params: cardState.physicsParams }) });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error);
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSavingFiles: false, saveFileStatus: result.message, savedPaths: result.saved_files || {} } }));
            } catch (err) {
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSavingFiles: false, saveFileError: err.message } }));
            }
        };

        const handleRunSimulation = async (index) => { /* 保持原代码 */
            const path = scenarioCardStates[index]?.savedPaths?.xosc_1_0_path_on_server;
            if (!path) return;
            setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSimulating: true, simulationStatus: "...", simulationError: null } }));
            try {
                await fetch(`${API_BASE_URL}/api/run_simulation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ xosc_1_0_file_path_for_sim: path }) });
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSimulating: false, simulationStatus: "Simulation Started" } }));
            } catch (err) {
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isSimulating: false, simulationError: err.message } }));
            }
        };

        const handleDeleteFile = async (index) => { /* 保持原代码 */
            const path = scenarioCardStates[index]?.savedPaths?.xosc_1_0_path_on_server;
            if (!path) return;
            if (!confirm("Are you sure you want to delete the generated .xosc file from the server?")) return;
            setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isDeleting: true } }));
            try {
                const response = await fetch(`${API_BASE_URL}/api/delete_simulation_file`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file_path: path }) });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Delete failed");
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isDeleting: false, savedPaths: {}, saveFileStatus: null, simulationStatus: "File Deleted" } }));
                alert("File deleted successfully.");
            } catch (err) {
                alert("Error deleting file: " + err.message);
                setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], isDeleting: false } }));
            }
        };

        // === [核心修改] 渲染部分：根据 currentView 决定显示表单还是结果页 ===
        return (
            <PageWrapper 
                title={currentView === 'form' ? "Generate Dangerous Scenarios from Test Functions" : "Generated Scenarios Results"} 
                subtitle={currentView === 'form' ? "Batch generate dangerous driving scenarios and OpenSCENARIO code based on test functions and environment descriptions." : "Review generated scenarios and simulate. You can return to edit anytime."}
            >
                {/* ---------- 视图 1: 填写表单 ---------- */}
                {currentView === 'form' && (
                    <>
                        <form onSubmit={handleSubmitDSG} className="mb-8 animate-fadeIn">
                           <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                                <div className="md:col-span-3">
                                    <label htmlFor="test-function" className="block text-lg font-semibold text-gray-800 mb-2">1. Test Function Description (Required):</label>
                                    <textarea id="test-function" className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 text-sm focus:ring-blue-500 focus:border-blue-500" rows="3" value={testFunction} onChange={(e) => setTestFunction(e.target.value)} placeholder="e.g., Multi-vehicle rear-end collision risk in patchy fog on highway at night" disabled={isLoadingDSG} required ></textarea>
                                </div>
                           </div>
                           <div className="mb-6">
                              <h3 className="text-lg font-semibold text-gray-800 mb-2">2. Other Layer Details (Optional)</h3>
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                                {Object.keys(layerInputs).map((layerKey) => (
                                    <div key={layerKey} className={`flex flex-col space-y-2 ${layerKey === 'L4' ? 'md:col-span-2' : ''}`}>
                                      <label htmlFor={`layer-input-${layerKey}`} className={`block text-base font-medium ${layerKey === 'L4' ? 'font-semibold text-blue-700' : ''}`}>{layerLabels[layerKey]}{layerKey === 'L4' ? ' (Core behavior!)' : ''}:</label>
                                      <textarea id={`layer-input-${layerKey}`} rows={layerKey === 'L4' ? 4 : 2} className={`block w-full rounded-md p-2 focus:ring-blue-500 focus:border-blue-500 shadow-sm ${layerKey === 'L4' ? 'border-blue-400' : 'border-gray-300'}`} value={layerInputs[layerKey]} onChange={(e) => handleLayerInputChange(layerKey, e.target.value)} placeholder={layerPlaceholders[layerKey]} disabled={isLoadingDSG} />
                                    </div>
                                ))}
                              </div>
                           </div>
                           <div className="max-w-sm mb-4">
                               <label htmlFor="num-to-generate" className="block text-lg font-semibold text-gray-700 mb-2">3. Number of AI scenario</label>
                               <input
                                   id="num-to-generate"
                                   type="number"
                                   min="1"
                                   max="20"
                                   value={numToGenerate}
                                   onChange={(e) => setNumToGenerate(Math.max(1, Math.min(20, parseInt(e.target.value || '1', 10))))}
                                   className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 text-sm focus:ring-blue-500 focus:border-blue-500"
                                   disabled={isLoadingDSG}
                               />
                               <p className="text-base text-gray-500 mt-1">Range 1-20</p>
                           </div>
                           <button type="submit" className="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 text-lg font-semibold flex items-center justify-center disabled:opacity-50 transition-colors" disabled={isLoadingDSG}> 
                               {isLoadingDSG && <LoadingIconSvg className="text-white"/>} 
                               {isLoadingDSG ? "Generating..." : "Generate Scenario Description (JSON)"} 
                           </button>
                        </form>
                        {errorDSG && !isLoadingDSG && ( <div className="bg-red-100 border-l-4 border-red-500 p-4 text-red-700 mt-6 rounded-md"><p className="font-bold">Error:</p><p className="whitespace-pre-wrap">{errorDSG}</p></div> )}
                        {isLoadingDSG && !generatedScenarios.length && ( 
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-white bg-opacity-60 backdrop-blur-sm">
                                <div className="bg-white p-8 rounded-2xl shadow-xl flex flex-col items-center border border-blue-100 w-full max-w-md">
                                    <div className="inline-block animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 border-blue-600"></div>
                                    <p className="mt-5 text-lg font-bold text-blue-800">Working on it...</p>
                                    <p className="mt-2 text-sm text-gray-500">Generating logical scenario, please wait.</p>
                                    <div className="w-full mt-5">
                                        <div className="flex justify-between text-sm text-gray-600 mb-2">
                                            <span>Completed</span>
                                            <span>{generationProgress.current}/{generationProgress.total || numToGenerate}</span>
                                        </div>
                                        <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden">
                                            <div
                                                className="h-3 bg-blue-600 rounded-full transition-all duration-300 ease-out"
                                                style={{ width: `${generationProgress.total ? Math.min(100, (generationProgress.current / generationProgress.total) * 100) : 0}%` }}
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div> 
                        )}
                    </>
                )}

                {/* ---------- 视图 2: 显示生成的场景结果 ---------- */}
                {currentView === 'results' && generatedScenarios.length > 0 && (
                    <div className="mt-2 animate-fadeIn">
                        
                        {/* 带有返回按钮的 Header 区域 */}
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-gray-200">
                            <h3 className="text-xl sm:text-2xl font-semibold text-gray-800 mb-4 sm:mb-0">
                                Found or generated {generatedScenarios.length} related scenarios:
                            </h3>
                            {/* [新增] 右上角的返回按钮 */}
                            <button 
                                onClick={() => setCurrentView('form')} 
                                className="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-blue-600 font-medium py-2 px-4 rounded-lg flex items-center transition-all shadow-sm"
                            >
                                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                                </svg>
                                Back to Form
                            </button>
                        </div>

                        {/* 结果卡片展示区 */}
                        <div className={`grid grid-cols-1 ${generatedScenarios.length > 1 ? 'lg:grid-cols-2' : ''} gap-8 pb-24`}>
                            {generatedScenarios.map((scenarioWrapper, index) => ( 
                                <DisplaySingleScenario 
                                    key={index} 
                                    scenario={scenarioWrapper.scenario_data} 
                                    source={scenarioWrapper.source} 
                                    isActive={selectedScenarioIndex === index} 
                                    onCardClick={() => setSelectedScenarioIndex(selectedScenarioIndex === index ? null : index)} 
                                    cardState={scenarioCardStates[index] || { activeTab: 'scenario' }} 
                                    understandingData={understandingState[index]}
                                    onStep1Click={() => onSingleTaskStart(index, scenarioWrapper.scenario_data)}
                                    onStep2Click={() => handleConfirmAndGenerateCode(index)}
                                    onSpeedChange={(speedKey, newVal) => {
                                        setUnderstandingState(prev => ({
                                            ...prev,
                                            [index]: {
                                                ...prev[index],
                                                speedOptions: prev[index].speedOptions.map(opt => opt.key === speedKey ? {...opt, selectedValue: parseFloat(newVal)} : opt)
                                            }
                                        }));
                                    }}
                                    onPhysicsChange={(category, entityKey, param, value,actionIndex) => handlePhysicsParamChange(index, category, entityKey, param, value, actionIndex)} 
                                    onSaveFilesClick={() => handleSaveFilesToServer(index)} 
                                    onRunSimulationClick={() => handleRunSimulation(index)} 
                                    onDeleteFileClick={() => handleDeleteFile(index)}
                                    onTabChange={(tabName) => setScenarioCardStates(prev => ({ ...prev, [index]: { ...prev[index], activeTab: tabName } }))}
                                    isSelected={selectedForBatch.includes(index)}
                                    onToggleBatch={(e) => {
                                        if (e.target.checked) setSelectedForBatch(prev => [...prev, index]);
                                        else setSelectedForBatch(prev => prev.filter(i => i !== index));
                                    }} 
                                /> 
                            ))}
                        </div>

                        {/* === [新增] 底部批量操作悬浮栏 === */}
                        {selectedForBatch.length > 0 && !batchState.isProcessing && currentView === 'results' && (
                            <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.15)] p-4 flex justify-between items-center z-[80] px-10 animate-slideUp">
                                <div>
                                    <span className="text-xl font-extrabold text-blue-600 bg-blue-100 px-3 py-1 rounded-full">{selectedForBatch.length}</span>
                                    <span className="text-gray-700 font-medium ml-3 text-lg">Scenarios Selected</span>
                                </div>
                                <button 
                                    onClick={startBatchProcess}
                                    className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-3.5 rounded-lg font-bold hover:from-blue-700 hover:to-indigo-700 shadow-lg transform hover:scale-105 transition-all flex items-center text-lg"
                                >
                                    <ICONS.ai className="w-6 h-6 mr-3" />
                                    Understanding & Extraction Selected
                                </button>
                            </div>
                        )}
                    </div>
                )}
                {/* ---------- 全新双栏 Agent Modal ---------- */}
                {/* ---------- 全新混合双栏及任务队列 Agent Modal ---------- */}
                {agentProgressModal.isOpen && (
                    <div className="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-[100] p-6 backdrop-blur-sm transition-all duration-300">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-7xl h-[85vh] flex flex-col overflow-hidden border border-blue-100">
                            
                            {/* Header 区域 */}
                            <div className="bg-blue-50 px-6 py-4 flex items-center justify-between border-b border-blue-100">
                                <div className="flex items-center space-x-4">
                                    {agentProgressModal.status === 'processing' ? (
                                        <div className="animate-spin rounded-full h-7 w-7 border-t-2 border-b-2 border-blue-500"></div>
                                    ) : agentProgressModal.status === 'success' ? (
                                        <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                    ) : (

                                            <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                                            MODEL COT STREAM
                                        </span>

                                    <div className="flex-1 p-6 overflow-y-auto">
                                        {agentProgressModal.streamBlocks.length === 0 && (
                                            <span className="text-gray-600 italic text-sm">Waiting for agent to start...</span>
                                        )}
                                        {agentProgressModal.streamBlocks.flatMap((block, idx) => {
                                            if (block.type === 'thought_bundle' && Array.isArray(block.blocks)) {
                                                return block.blocks.map((nestedBlock, nestedIdx) => ({
                                                    key: `${idx}-${nestedIdx}`,
                                                    node: (
                                                        <div className="font-mono text-[13px] leading-relaxed text-gray-500 whitespace-pre-wrap break-words mb-5 pl-4 border-l-[3px] border-gray-700">
                                                            {nestedBlock.text}
                                                        </div>
                                                    )
                                                }));
                                            }
                                            if (block.type === 'log') {
                                                const text = block.text || '';
                                                let textColor = "text-gray-500";
                                                if (text.includes("➡️") || text.includes("🔍") || text.includes("[STEP_START]")) textColor = "text-blue-600 font-bold";
                                                else if (text.includes("⚠️") || text.includes("Failed")) textColor = "text-yellow-600 font-semibold";
                                                else if (text.includes("✅") || text.includes("[STEP_END]")) textColor = "text-green-600 font-bold";
                                                return [{ key: idx, node: <div className={`${textColor} break-words whitespace-pre-wrap mb-2`}>{text}</div> }];
                                            }
                                            if (block.type === 'node_summary') {
                                                return [{
                                                    key: idx,
                                                    node: (
                                                        <div className="font-medium text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-3 mb-3 whitespace-pre-wrap break-words">
                                                            {block.text}
                                                        </div>

                                                }];
                                            }
                                            return [{
                                                key: idx,
                                                node: (
                                                    <div className="font-mono text-[13px] leading-relaxed text-gray-500 whitespace-pre-wrap break-words mb-5 pl-4 border-l-[3px] border-gray-700">
                                                        {block.text}
                                                    </div>
                                                )
                                            }];
                                        }).map(({ key, node }) => <React.Fragment key={key}>{node}</React.Fragment>)}
                                        {agentProgressModal.status === 'processing' && <span className="inline-block w-2 h-4 bg-indigo-500 ml-1 animate-pulse"></span>}
                                        <div ref={el => el && el.scrollIntoView({ behavior: 'smooth', block: 'nearest' })} />
                                    </div>
                                </div>

                                {/* 右栏：任务队列 (40%) */}
                                <div className="lg:w-2/5 h-full flex flex-col bg-blue-50/40">
                                    <div className="bg-blue-50 px-6 py-4 border-b border-blue-100 shadow-sm z-10 flex justify-between items-center">

                                            <svg className="w-4 h-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                                            TASK QUEUE
                                        </h4>
                                    </div>
                                    
                                    <div className="flex-1 p-6 overflow-y-auto">
                                        <ul className="space-y-3">
                                            {agentProgressModal.batchTasks.map((task) => (
                                                <li key={task.index} className={`flex items-center justify-between p-3.5 rounded-lg border transition-colors ${
                                                    task.status === 'processing' ? 'bg-blue-100 border-blue-300 shadow-[0_0_15px_rgba(37,99,235,0.12)]' : 
                                                    task.status === 'success' ? 'bg-green-50 border-green-200' : 
                                                    task.status === 'error' ? 'bg-red-50 border-red-200' : 
                                                    'bg-white border-blue-100'

                                                    <div className="flex items-center space-x-3 w-full overflow-hidden">
                                                        {/* Status Icon */}
                                                        {task.status === 'processing' && <div className="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-blue-500 shrink-0"></div>}
                                                        {task.status === 'success' && <svg className="w-6 h-6 text-green-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>}
                                                        {task.status === 'error' && <svg className="w-6 h-6 text-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>}
                                                        {task.status === 'pending' && <div className="w-5 h-5 rounded-full border-2 border-blue-300 shrink-0"></div>}
                                                        
                                                        {/* Scenario Name */}
                                                        <span className={`text-[14px] truncate font-semibold w-full ${

                                    {/* 错误提示区域置于右栏底部 */}
                                    {agentProgressModal.status === 'error' && (

                                            <div className="flex items-start">
                                                <svg className="w-5 h-5 text-red-500 mr-2 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                <div>
                                                    <h4 className="text-red-700 font-bold text-sm">Task Interrupted</h4>

                                        </div>
                                    )}
